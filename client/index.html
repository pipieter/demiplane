<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <!-- Toolbar -->
    <div class="toolbar">
      <div id="toolbar-settings" class="toolbar-section">
        <button class="toolbar-button" data-tab="help" disabled>
          <i class="fa-solid fa-gear"></i>
          <span class="tooltip-text">Settings</span>
        </button>
        <button id="server-status" class="toolbar-button">
          <i id="server-status-icon" class="fa-solid fa-xmark"></i>
          <span id="server-status-text" class="tooltip-text">Offline</span>
        </button>
        <button class="toolbar-button" data-tab="user">
          <i class="fa-solid fa-user"></i>
          <span class="tooltip-text">User Settings</span>
        </button>
      </div>

      <div id="toolbar-draw" class="toolbar-section">
        <button class="toolbar-button" id="begin-circle-button" class="draw-button" data-tab="draw">
          <i class="fa-solid fa-circle"></i>
          <span class="tooltip-text">Draw Circle</span>
        </button>
        <button class="toolbar-button" id="begin-rect-button" class="draw-button" data-tab="draw">
          <i class="fa-solid fa-square"></i>
          <span class="tooltip-text">Draw Rectangle</span>
        </button>
        <button class="toolbar-button" id="begin-line-button" class="draw-button" data-tab="draw">
          <i class="fa-solid fa-minus"></i>
          <span class="tooltip-text">Draw Line</span>
        </button>
        <button class="toolbar-button" id="begin-text-button" class="draw-button" disabled data-tab="draw">
          <i class="fa-solid fa-t"></i>
          <span class="tooltip-text">Draw Textbox</span>
        </button>
        <button class="toolbar-button" id="begin-drawing-button" class="draw-button" data-tab="draw">
          <i class="fa-solid fa-pencil"></i>
          <span class="tooltip-text">Freedraw</span>
        </button>
        <label for="upload-token-button">
          <i class="fa-solid fa-image"></i>
          <input id="upload-token-button" type="file" accept="image/*" style="display: none" />
          <span class="tooltip-text">Upload Image</span>
        </label>
      </div>

      <div id="toolbar-board" class="toolbar-section">
        <button class="toolbar-button" data-tab="token">
          <i class="fa-solid fa-images"></i>
          <span class="tooltip-text">Token Settings</span>
        </button>
        <button class="toolbar-button" data-tab="grid">
          <i class="fa-solid fa-table-cells-large"></i>
          <span class="tooltip-text">Grid Settings</span>
        </button>
        <button class="toolbar-button" data-tab="background" disabled>
          <i class="fa-solid fa-panorama"></i>
          <span class="tooltip-text">Background Settings</span>
        </button>
      </div>
    </div>

    <div class="toolbar-menu" id="tab-draw" style="display: none;">
      <div class="toolbar-menu-content">
        <label class="toolbar-button">
          <i class="fa-solid fa-palette" style="color: var(--draw-color);"></i>
          <input type="color" id="draw-color-input" />
          <span class="tooltip-text">Select Color</span>
        </label>

        <label class="toolbar-button">
          <i class="fa-solid fa-brush"></i>
          <input type="number" id="draw-border-number" min="1" max="100" step="1" value="4" />
          <span class="tooltip-text">Brush Width</span>
        </label>

        <label class="toolbar-button">
          <i class="fa-regular fa-square check"></i>
          <i class="fa-solid fa-square uncheck"></i>
          <input type="checkbox" id="draw-border-checkbox" />
          <span class="tooltip-text">Border Only</span>
        </label>
      </div>
    </div>

    <div class="toolbar-menu" id="tab-grid" style="display: none;">
      <section class="toolbar-menu-content">
        <label>
          <i class="fa-solid fa-lock check"></i>
          <i class="fa-solid fa-unlock uncheck"></i>
          <input type="checkbox" id="grid-global-checkbox" />
          <span class="tooltip-text">Default grid-lock</span>
        </label>
            
        <label for="grid-size">
          <i class="fa-solid fa-ruler-combined"></i>
          <span class="tooltip-text">Grid-size</span>
          <input id="grid-size" type="number" name="grid-size" min="16" max="2048" step="1" value="64" />
        </label>
      
        <label for="grid-offset-X">
          <i class="fa-solid fa-x"></i>
          <span class="tooltip-text">X-offset</span>
          <input id="grid-offset-X" type="number" name="grid-offset-X" min="0" step="1" value="0" />
        </label>
      
        <label for="grid-offset-Y">
          <i class="fa-solid fa-y"></i>
          <span class="tooltip-text">Y-offset</span>
          <input id="grid-offset-Y" type="number" name="grid-offset-Y" min="0" step="1" value="0" />
        </label>
            
        <label for="upload-background-button" class="label-button">
          <i class="fa-solid fa-panorama"></i>
          <span class="tooltip-text">Upload Background</span>
          <input id="upload-background-button" type="file" accept="image/*" style="display: none" />
        </label>
      </section>
    </div>

    <div class="toolbar-menu" id="tab-token" style="display: none;">
      <section class="toolbar-menu-content">
        <label for="token-edit-x">
          <i class="fa-solid fa-x"></i>
          <span class="tooltip-text">X</span>
          <input id="token-edit-x" type="number" name="token-edit-x" min="0" step="1" value="64" disabled />
        </label>
        
        <label for="token-edit-y">
          <i class="fa-solid fa-y"></i>
          <span class="tooltip-text">Y</span>
          <input id="token-edit-y" type="number" name="token-edit-y" min="0" step="1" value="64" disabled />
        </label>
        
        <label for="token-edit-w">
          <i class="fa-solid fa-ruler-horizontal"></i>
          <span class="tooltip-text">Width</span>
          <input id="token-edit-w" type="number" name="token-edit-w" min="8" step="1" value="64" disabled />
        </label>
        
        <label for="token-edit-h">
          <i class="fa-solid fa-ruler-vertical"></i>
          <span class="tooltip-text">Height</span>
          <input id="token-edit-h" type="number" name="token-edit-h" min="8" step="1" value="64" disabled />
        </label>
        
        <label for="token-edit-r">
          <i class="fa-solid fa-rotate"></i>
          <span class="tooltip-text">Rotation</span>
          <input id="token-edit-r" type="number" name="token-edit-r" min="-180" max="180" step="1" value="0" disabled />
        </label>
        
        <button id="token-edit-delete" disabled>
          <i class="fa-solid fa-trash-can"></i>
          <span class="tooltip-text">Remove token</span>
        </button>
        <button id="token-edit-move-up">
          <i class="fa-solid fa-circle-up"></i>
          <span class="tooltip-text">Move up</span>
        </button>
        <button id="token-edit-move-down">
            <i class="fa-solid fa-circle-down"></i>
            <span class="tooltip-text">Move down</span>
        </button>

        <label for="token-list-checkbox">
          <i class="fa-solid fa-table-list"></i>
          <span class="tooltip-text uncheck">Show token list</span>
          <span class="tooltip-text check">Hide token list</span>
          <input type="checkbox" id="token-list-checkbox" />
        </label>
        
        <ul id="token-list" style="display: none"></ul>
      </section>
    </div>

    <div class="toolbar-menu" id="tab-user" style="display: none;">
      <section class="toolbar-menu-content">
        <label for="user-input-color">
          <i class="fa-solid fa-user" style="color: var(--user-color);"></i>
          <input id="user-input-color" type="color" name="user-input-color" />
          <span class="tooltip-text">User Color</span>
        </label>

        <label for="user-input-name">
          <input id="user-input-name" type="text" name="user-input-name" />
        </label>

        <ul id="user-list"></ul>
      </section>
    </div>

    <!-- Whiteboard -->
    <div id="whiteboard-container">
      <svg id="whiteboard" width="100vw" height="100vh">
        <g id="viewport">
          <svg id="whiteboard-background-layer" stroke="#444" stroke-width="4">
            <defs>
              <!-- Grid-size is declared through code -->
              <pattern id="grid-pattern" width="50px" height="50px" patternUnits="userSpaceOnUse">
                <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#666" stroke-width="1" />
              </pattern>
            </defs>
            <image id="whiteboard-background-image" width="1024px" height="1024px" />
            <rect id="whiteboard-background-grid" fill="url(#grid-pattern)" width="100%" height="100%" />
          </svg>

          <svg id="whiteboard-objects-layer"></svg>

          <!-- Small text that appears under transform box -->
          <svg style="overflow: visible; margin: 4px">
            <rect id="transform-size-background" fill="white" stroke-width="2" stroke="var(--moveable-blue)" />
            <text id="transform-size-text" fill="var(--moveable-blue)" font-size="18"></text>
          </svg>

          <!-- Rectangular hover box -->
          <svg class="whiteboard-resize" id="whiteboard-hover" style="display: none">
            <rect class="resize-marking" id="hover-box" fill="none" />
          </svg>

          <svg id="whiteboard-drawing-layer" width="1024px" height="1024px" style="display: none">
            <!-- Note: this rectangle is required to ensure the layer has something to draw on. -->
            <!-- It also adds a small color effect to when the user is drawing, so they know they are in drawing mode. -->
            <rect fill="#44444411" width="100%" height="100%" />
            <ellipse
              id="whiteboard-drawing-circle"
              fill="none"
              stroke="var(--draw-color)"
              stroke-width="4px"
              style="display: none"
            />
            <rect
              id="whiteboard-drawing-rectangle"
              fill="none"
              stroke="var(--draw-color)"
              stroke-width="4px"
              style="display: none"
            />
            <line id="whiteboard-drawing-line" stroke="var(--draw-color)" stroke-width="4px" style="display: none" />
            <path
              id="whiteboard-drawing-free"
              fill="none"
              stroke="var(--draw-color)"
              stroke-width="10px"
              style="display: none"
              stroke-linecap="round"
            />

            <foreignObject id="whiteboard-drawing-cursor" width="30px" height="30px" style="overflow: visible;">
                <i class="fa-solid fa-pencil"></i>
            </foreignObject>
          </svg>

          <foreignObject id="user-cursors-container" width="1024px" height="1024px" pointer-events="none">
            <div id="user-cursors" width="100%" height="100%"></div>
          </foreignObject>
          <foreignObject id="moveable" width="1024px" height="1024px" pointer-events="none"></foreignObject>
        </g>
      </svg>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
